# pnpm settings.
# allowBuilds: explicit allowlist of packages permitted to run install/build
# scripts (pnpm blocks all others by default) — a deliberate supply-chain
# control. esbuild backs the Vite build; unrs-resolver backs ESLint's import
# resolution; prisma/@prisma/engines set up the query engine binaries.
# See specs/07-security.md.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  unrs-resolver: true
  vue-demi: true
# Excluded from the minimum-release-age supply-chain policy active in this env.
minimumReleaseAgeExclude:
  - prettier@3.9.9
# `pnpm audit` allowlist: high-severity advisories in transitive deps that are
# not in our runtime path, kept explicit so CI still fails on anything new.
# Reviewed 2026-09-25.
auditConfig:
  ignoreGhsas:
    - GHSA-3f6p-5ww8-9rcr # mysql2 (via unstorage>db0) — we use SQLite/Prisma, never MySQL
    - GHSA-ggr8-5vv4-36mx # deepmerge-ts (via prisma>@prisma/config) — build-time config, not runtime
